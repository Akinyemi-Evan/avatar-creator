build:
  gpu: true
  python_version: "3.9"
  system_packages:
    - "libgl1-mesa-glx"
    - "libglib2.0-0"
  python_packages:
    - "torch==1.13.1"
    - "torchvision==0.14.1"
    - "numpy==1.23.5"
    - "opencv-python==4.7.0.72"
    - "scikit-image==0.19.3"
    - "scipy==1.10.1"
    - "chumpy==0.70"
    - "face-alignment==1.3.5"
    - "trimesh==3.21.7"
    - "pyrender==0.1.45"
    - "Pillow==9.5.0"
  run:
    - curl -o /tmp/deca_model.tar https://files.is.tue.mpg.de/deca/deca_model.tar
    - tar xf /tmp/deca_model.tar -C /src
    - curl -o /tmp/generic_model.pkl https://files.is.tue.mpg.de/deca/data/generic_model.pkl
    - mkdir -p /src/data
    - mv /tmp/generic_model.pkl /src/data/

predict: "predict.py:Predictor"
